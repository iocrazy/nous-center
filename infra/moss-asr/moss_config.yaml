# nous-moss-asr 生产 pipeline config —— sgl-omni serve --config 读它。
# 基线 = 默认 MossTranscribeDiarizePipelineConfig,只改两处(SPIKE.md 真机验证):
#
#   1. mem_fraction_static: 0.5
#      共享 3090(index0,与桌面/ComfyUI 同卡),不能抢整卡。spike 实测:0.25 起得来但
#      KV 挤占后单请求都不够;0.5 跑 7.7min 双人播客稳,KV 余量覆盖长音频 max_new_tokens。
#   2. attention/CUDA graph 走默认 = **flashinfer 通路**(2026-07-21 切换,SPIKE §8):
#      venv 已五钉 13.3 工具链(setup.sh),sm_86 JIT 现编可过;实测 7.7min 播客 11s
#      (torch_native 是 31.5s)。冷启(空 JIT 缓存)首次要数分钟现编;warm ~36s。
#      【回退】若 flashinfer 出数值/编译问题,在 factory_args 加回:
#        server_args_overrides: {disable_cuda_graph: true, attention_backend: torch_native}
#      (三行,即回 torch_native 通路;triton backend 别用——数值坏,输出乱码。)
config_cls: MossTranscribeDiarizePipelineConfig
model_path: /media/heygo/program/models/nous/speech/MOSS-Transcribe-Diarize
entry_stage: asr
stages:
  - name: asr
    process: asr
    factory: sglang_omni.models.moss_transcribe_diarize.stages.create_sglang_moss_transcribe_diarize_executor
    factory_args:
      device: "cuda:0"          # 进程内唯一可见卡(start_serve.sh 用 UUID 钉 3090)= cuda:0
      max_running_requests: 16
      encoder_cache_size_bytes: 4294967296
      request_build_max_workers: 8
      request_build_max_pending: 16
      mem_fraction_static: 0.5
    gpu: 0
    terminal: true
