# backend/configs/model_paths.yaml
# role → glob-pattern dirs (relative to LOCAL_MODELS_PATH). Analogous to ComfyUI
# extra_model_paths.yaml. component_scanner globs these to populate loader-node
# file dropdowns (PR-4). Most patterns are flat globs; loras also has a
# recursive (**) variant for nested LoRA collections.
#
# base_path is NOT in this file — it's read from settings.LOCAL_MODELS_PATH.

# 角色 → glob(对齐 ComfyUI folder_paths)。组件单文件递归扫描各自目录，
# diffusers 整模型由 checkpoint 角色按目录扫描。
roles:
  diffusion_models:
    - media/diffusion_models/**/*.safetensors   # DiT 单文件(comfy 量化/原生本体)
    - media/diffusion_models/**/*.gguf
  clip:
    - media/text_encoders/**/*.safetensors
    - media/text_encoders/**/*.gguf             # GGUF 文本编码器(CLIPLoaderGGUF 等价,如 Z-Image-Engineer)
  vae:
    - media/vae/**/*.safetensors
  loras:
    - media/loras/**/*.safetensors
  # 整模型目录由 component_scanner 扫描 diffusers/<model>/。
  checkpoint: []
